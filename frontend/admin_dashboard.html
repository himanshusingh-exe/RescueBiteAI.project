```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - RescueBite AI</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f6;
    color: #26332e;
}
header {
    background: #174d3a;
    color: white;
    padding: 22px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}
header h2 { margin: 0; }
button {
    border: 0;
    border-radius: 7px;
    padding: 11px 17px;
    cursor: pointer;
    font-weight: bold;
}
.logout { background: white; color: #174d3a; }
main { padding: 30px 6%; }
.subtitle { color: #68766f; margin-bottom: 25px; }
.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 18px;
}
.card {
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #0000000d;
    border: 1px solid #e7eeea;
}
.card p { color: #68766f; margin: 0 0 12px; }
.card h1 { margin: 0; color: #174d3a; font-size: 34px; }
.section {
    background: white;
    padding: 24px;
    border-radius: 12px;
    margin-top: 25px;
    box-shadow: 0 3px 12px #0000000d;
}
.section h3 { margin-top: 0; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.action-btn { background: #174d3a; color: white; }
#message { margin-top: 15px; color: #b42318; }
@media(max-width:600px) {
    main { padding: 22px 4%; }
    header { padding: 18px 4%; }
}
</style>
</head>
<body>

<header>
    <h2>🛡️ RescueBite AI — Admin Dashboard</h2>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<main>
    <h2>Welcome, Administrator!</h2>
    <p class="subtitle">Monitor food donations and platform activity.</p>

    <div class="stats">
        <div class="card">
            <p>Registered Restaurants</p>
            <h1 id="restaurants">—</h1>
        </div>
        <div class="card">
            <p>Registered NGOs</p>
            <h1 id="ngos">—</h1>
        </div>
        <div class="card">
            <p>Total Food Donations</p>
            <h1 id="donations">—</h1>
        </div>
        <div class="card">
            <p>Completed Donations</p>
            <h1 id="completed">—</h1>
        </div>
    </div>

    <div class="section">
        <h3>Platform Management</h3>
        <div class="actions">
            <button class="action-btn" onclick="openPage('ngo_management.html')">Manage NGOs</button>
            <button class="action-btn" onclick="openPage('restaurant-management.html')">Manage Restaurants</button>
            <button class="action-btn" onclick="openPage('platform_analytics.html')">Platform Analytics</button>
        </div>
        <p id="message"></p>
    </div>
</main>

<script>
async function loadStats() {
    try {
        const response = await fetch('/api/admin/stats');
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Could not load dashboard statistics.');
        }

        document.getElementById('restaurants').textContent = data.total_restaurants ?? 0;
        document.getElementById('ngos').textContent = data.total_ngos ?? 0;
        document.getElementById('donations').textContent = data.total_donations ?? 0;
        document.getElementById('completed').textContent = data.completed_donations ?? 0;

    } catch (error) {
        document.getElementById('message').textContent = error.message;
    }
}

function openPage(page) {
    window.location.href = page;
}

async function logout() {
    try {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = 'admin_login.html';
    } catch (error) {
        alert('Logout failed. Please try again.');
    }
}

loadStats();
</script>

</body>
</html>
```
